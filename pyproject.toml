[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-production-decisions"
version = "0.4.0"
description = "Reproducible exact, evolutionary, and surrogate-assisted multiobjective agricultural production planning."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Leonardo Hernán Talero Sarmiento"}
]
keywords = ["production planning", "multiobjective optimization", "NSGA-II", "SCIP", "surrogate-assisted optimization", "agriculture"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "requests>=2.31",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "tabulate>=0.9",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
scip = ["pyscipopt>=5.0"]
data = ["zeep>=4.2"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["pyscipopt>=5.0", "zeep>=4.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
agriopt = "agriopt.cli:main"

[project.urls]
Repository = "https://github.com/eitt/agri-production-decisions"
Paper = "https://doi.org/<DOI_PLACEHOLDER>"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["paper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

