project:
  run_id: maintenance_smoke
  schedule_seed: 715
data:
  productivity: data/maintenance/productividad_actualizada.csv
  price_history: data/maintenance/prices_weekly_model_prefix_observed.csv
  price_forecast: data/maintenance/price_forecast_104w.csv
  demand: null
maintenance:
  interval_weeks: 8
  cost_cop_ha_pass: 250000
  max_idle_weeks: null
  scenarios:
    interval_weeks:
    - 4
    - 8
    - 12
    cost_cop_ha_pass:
    - 0
    - 100000
    - 250000
    - 500000
    max_idle_weeks:
    - null
    - 26
    hard_idle_weeks:
    - 4
    - 8
    - 12
    - 26
experiment:
  instances:
  - I01_micro
  seeds:
  - 7200
  methods:
  - exact
  - nsga2
  - random_search
  - random_local
  - proxy_local
  - surrogate_local
  workers: 1
  budget_mode: generations
  population: 8
  generations: 5
  search:
    refinements_per_generation: 2
    neighbors: 8
    min_training_samples: 8
    retrain_every: 8
    training_window: 128
    n_estimators: 32
    exploration_probability: 0.25
    checkpoint_every_generations: 1
  exact:
    epsilon_fractions:
    - 0.25
    - 0.5
    - 0.75
    - 0.9
    - 0.1
    per_phase_time_limit_s: 2
    memory_limit_mb: 512
    threads: 1
    mip_gap: 0.0001
